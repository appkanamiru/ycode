# Multi-tenant Ycode platform: app, migrations, Postgres, Redis, Umami
# (visitor statistics) and Caddy.
#
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# Copy deploy/.env.example to deploy/.env first. For a local run, see
# docker-compose.local.yml and deploy/README.md.

name: ycode

x-app-environment: &app-environment
  YCODE_DB_DRIVER: postgres
  YCODE_MULTI_TENANT: "true"
  DATABASE_URL: postgres://ycode:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ycode
  REDIS_URL: redis://redis:6379
  STORAGE_DIR: /data/uploads
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL (the editor, e.g. https://app.example.com)}
  PLATFORM_SITES_DOMAIN: ${PLATFORM_SITES_DOMAIN:?set PLATFORM_SITES_DOMAIN (e.g. example.com)}
  PLATFORM_DOMAIN_IPV4: ${PLATFORM_DOMAIN_IPV4:-}
  PLATFORM_HOME_SITE: ${PLATFORM_HOME_SITE:-}
  SMTP_URL: ${SMTP_URL:?set SMTP_URL}
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
  # Named in the generator meta tag and the source comment of published sites
  SITE_GENERATOR_NAME: ${SITE_GENERATOR_NAME:-Appkanamiru}
  SITE_GENERATOR_URL: ${SITE_GENERATOR_URL:-appkanamiru.cz}
  # Accounts that may open the visitor statistics
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  UMAMI_URL: http://umami:3000
  UMAMI_PUBLIC_URL: ${UMAMI_PUBLIC_URL:?set UMAMI_PUBLIC_URL (e.g. https://stats.example.com)}
  UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:?set UMAMI_ADMIN_PASSWORD}

x-app-image: &app-image
  build:
    context: ..
    dockerfile: Dockerfile
  image: ycode-platform:latest

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ycode
      POSTGRES_USER: ycode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycode -d ycode"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Realtime fan-out and presence; holds no data worth persisting
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs pending migrations (and tenancy, platform schema), then exits
  migrate:
    <<: *app-image
    command: ["npm", "run", "migrate:postgres"]
    environment: *app-environment
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-image
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Creates Umami's database and role in the shared Postgres, then exits
  umami-db:
    image: postgres:16.15-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ycode
      PGDATABASE: ycode
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$UMAMI_DB_PASSWORD" <<'SQL'
        select 'create role umami login' where not exists (select from pg_roles where rolname = 'umami') \gexec
        alter role umami with login password :'pw';
        select 'create database umami owner umami' where not exists (select from pg_database where datname = 'umami') \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy

  # Visitor statistics: dashboard on UMAMI_PUBLIC_URL, tracker on every site
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      umami-db:
        condition: service_completed_successfully

  caddy:
    # Caddy with the Cloudflare DNS module, for the wildcard certificate
    build: ./caddy
    image: ycode-caddy:2.11.7-cloudflare
    restart: unless-stopped
    environment:
      # API token with Zone > DNS > Edit permission on the platform domain
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - umami

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
