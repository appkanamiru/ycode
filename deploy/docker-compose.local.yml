# Local run on your machine, on top of docker-compose.yml:
#
#   docker compose --env-file deploy/local.env -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up -d --build
#
# Editor: https://app.localtest.me/ycode, sites: https://<slug>.localtest.me,
# emails (sign-in codes, invitations): http://localhost:8025

services:
  caddy:
    image: caddy:2.8.4
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  # Catches outgoing email instead of delivering it
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
